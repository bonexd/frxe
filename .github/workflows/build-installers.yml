name: Build APK + Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: build-installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 37
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-37"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Configure Android signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.BLOOD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.BLOOD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BLOOD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BLOOD_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            mkdir -p "$RUNNER_TEMP/frxe-signing"
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/frxe-signing/release.jks"
            echo "BLOOD_KEYSTORE=$RUNNER_TEMP/frxe-signing/release.jks" >> "$GITHUB_ENV"
            echo "BLOOD_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "BLOOD_KEY_ALIAS=${KEY_ALIAS:-blood}" >> "$GITHUB_ENV"
            echo "BLOOD_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Using persistent release signing key."
          else
            echo "VITR_CI_RELEASE_DEBUG_SIGNING=1" >> "$GITHUB_ENV"
            echo "Signing secrets are not configured; using CI debug signing."
          fi

      - name: Build release APK
        shell: bash
        run: |
          gradle -p mobile/android --no-daemon --stacktrace clean :app:testDebugUnitTest :app:assembleRelease

      - name: Prepare APK artifact
        id: apk
        shell: bash
        run: |
          VERSION="$(tr -d '\r\n' < VERSION)"
          mkdir -p artifacts/android
          cp mobile/android/app/build/outputs/apk/release/app-release.apk "artifacts/android/frxe-${VERSION}-android.apk"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: frxe-${{ steps.apk.outputs.version }}-android
          path: artifacts/android/*.apk
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows Installer
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Build MSI and setup EXE
        shell: cmd
        run: desktop\platforms\windows\build.bat

      - name: Read version
        id: winver
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: frxe-${{ steps.winver.outputs.version }}-windows
          path: |
            desktop/release-upload/*.msi
            desktop/release-upload/*.exe
            desktop/release-upload/*.sig
          if-no-files-found: error
          retention-days: 30
