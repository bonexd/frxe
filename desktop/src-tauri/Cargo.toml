[package]
name = "vitr"
version = "0.5.6"
description = "vitr for Windows, Linux and macOS"
authors = ["Blood"]
edition = "2021"

[lib]
name = "vitr_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
base64 = "0.22"
dirs = "6.0"
futures-util = "0.3"
mdns-sd = "0.21.3"
percent-encoding = "2.3"
playwire = "1.0.0"
regex = "1.11"
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.37"
tauri = { version = "2.8.5", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-opener = "2.5.0"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-updater = "2.11.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "process", "sync"] }
url = "2.5"
urlencoding = "2"
walkdir = "2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
